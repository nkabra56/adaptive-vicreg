[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 120
extend-exclude = [".cache_keras"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Scripts put src/ on sys.path before importing the package.
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["vicreg_tf"]
